<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Soccer Simulator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020304; display:flex; flex-direction:column; align-items:center;
       justify-content:center; min-height:100vh; overflow:hidden; user-select:none; }
canvas { display:block; }
#hint { margin-top:6px; font:11px 'Courier New'; color:#1e1e1e; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">WASD/Arrows = move &nbsp;|&nbsp; SPACE = sprint/boost &nbsp;|&nbsp; LEFT CLICK = fly UP &nbsp;|&nbsp; RIGHT CLICK = fly DOWN &nbsp;|&nbsp; Fly striker through goal ring to score &nbsp;|&nbsp; ESC = menu</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const CW = 960, CH = 620;
canvas.width = CW; canvas.height = CH;

// ── WORLD ────────────────────────────────────────────────────────────────────
const WL = 900, WW = 480, WH = 260; // length × width × height

// Goal rings (circles in the y-z plane) — moved inside field for visibility
const RING_R = 85;
const L_RING = { x: WL*0.07, cy: WW/2, cz: WH/2, r: RING_R }; // player defends
const R_RING = { x: WL*0.93, cy: WW/2, cz: WH/2, r: RING_R }; // player attacks

// ── BIRD'S-EYE LAYOUT ────────────────────────────────────────────────────────
const FX=38, FY=76, FW=CW-80-34, FH=CH-76-14; // main field area
const APX=FX+FW+10, APW=24;                    // altitude strip (right of field)
function ws(wx,wy){ return {sx:FX+(wx/WL)*FW, sy:FY+(wy/WW)*FH}; }
function altY(wz) { return FY+FH*(1-wz/WH); }

// ── INPUT ─────────────────────────────────────────────────────────────────────
const keys = {};
let mouseL = false, mouseR = false;
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousedown', e => { if(e.button===0) mouseL=true; if(e.button===2) mouseR=true; });
window.addEventListener('mouseup',   e => { if(e.button===0) mouseL=false; if(e.button===2) mouseR=false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function getInput() {
  return {
    ix: (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0),
    iy: (keys['KeyS']||keys['ArrowDown'] ?1:0) - (keys['KeyW']||keys['ArrowUp']  ?1:0),
    iz: (mouseL?1:0) - (mouseR?1:0),   // left click = up, right click = down
    boost: keys['Space'],               // space = sprint
  };
}

// ── PHYSICS ───────────────────────────────────────────────────────────────────
const DR=16, FRIC=0.87, THRUST=0.52, BMULT=2.0, MAXV=6.5;
const BCAP=100, BDRAIN=1.8, BREGEN=0.35;

function mkDrone(wx,wy,wz,team,role,label) {
  return { x:wx,y:wy,z:wz, vx:0,vy:0,vz:0, r:DR, team,role,label,
           boost:BCAP, boosting:false, spin:0, prevX:wx };
}

function applyThrust(d, ix, iy, iz, boosting) {
  const go = boosting && d.boost > 0;
  const th = THRUST * (go ? BMULT : 1);
  const len = Math.hypot(ix, iy, iz);
  if (len > 0) { d.vx+=ix/len*th; d.vy+=iy/len*th; d.vz+=iz/len*th; }
  d.boosting = go;
  d.boost = go ? Math.max(0,d.boost-BDRAIN) : Math.min(BCAP,d.boost+BREGEN);
  const spd = Math.hypot(d.vx,d.vy,d.vz);
  const cap = go ? MAXV*BMULT : MAXV;
  if (spd > cap) { d.vx=d.vx/spd*cap; d.vy=d.vy/spd*cap; d.vz=d.vz/spd*cap; }
  d.vx*=FRIC; d.vy*=FRIC; d.vz*=FRIC;
  d.prevX = d.x;
  d.x+=d.vx; d.y+=d.vy; d.z+=d.vz;
  d.spin += 0.20 + (go ? 0.12 : 0);
  const p=d.r;
  if(d.x<p){d.x=p;d.vx=Math.abs(d.vx)*0.5;} if(d.x>WL-p){d.x=WL-p;d.vx=-Math.abs(d.vx)*0.5;}
  if(d.y<p){d.y=p;d.vy=Math.abs(d.vy)*0.5;} if(d.y>WW-p){d.y=WW-p;d.vy=-Math.abs(d.vy)*0.5;}
  if(d.z<p){d.z=p;d.vz=Math.abs(d.vz)*0.5;} if(d.z>WH-p){d.z=WH-p;d.vz=-Math.abs(d.vz)*0.5;}
}

function collideDrones(a, b) {
  const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z, dist=Math.hypot(dx,dy,dz), min=a.r+b.r;
  if (dist>=min||dist===0) return;
  const nx=dx/dist,ny=dy/dist,nz=dz/dist, ov=(min-dist)*0.5;
  a.x-=nx*ov;a.y-=ny*ov;a.z-=nz*ov; b.x+=nx*ov;b.y+=ny*ov;b.z+=nz*ov;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny+(b.vz-a.vz)*nz;
  if (rv>=0) return;
  const imp=-(1+0.55)*rv*0.5;
  a.vx-=imp*nx;a.vy-=imp*ny;a.vz-=imp*nz; b.vx+=imp*nx;b.vy+=imp*ny;b.vz+=imp*nz;
}

function ringCrossed(striker, ring, dir) {
  const inRing = Math.hypot(striker.y-ring.cy, striker.z-ring.cz) < ring.r*0.88;
  if (!inRing) return false;
  // Drone wall-bounces at ring.x ± DR, so detect within 2 radii of the goal wall
  const thr = DR * 2.2;
  if (dir=== 1 && striker.prevX < ring.x-thr && striker.x >= ring.x-thr) return true;
  if (dir===-1 && striker.prevX > ring.x+thr && striker.x <= ring.x+thr) return true;
  return false;
}

// ── AI ────────────────────────────────────────────────────────────────────────
function steerTo(d, tx, ty, tz, canBoost, noise) {
  const dx=tx-d.x,dy=ty-d.y,dz=tz-d.z, dist=Math.hypot(dx,dy,dz);
  let ix=dist>5?dx/dist:0, iy=dist>5?dy/dist:0, iz=dist>5?dz/dist:0;
  const n=noise; ix+=(Math.random()-0.5)*n; iy+=(Math.random()-0.5)*n; iz+=(Math.random()-0.5)*n*0.5;
  applyThrust(d, ix, iy, iz, canBoost&&dist>90);
}

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function tickAI() {
  const n=difficulty==='easy'?0.85:difficulty==='medium'?0.32:0.06;
  drones.forEach(d=>{
    if (d===playerDrone) return;
    if (d.team==='ai') {
      if (d.role==='striker') {
        let ty=L_RING.cy, tz=L_RING.cz;
        drones.filter(p=>p.team==='player').forEach(p=>{
          if(p.x<d.x&&p.x>0&&Math.hypot(p.y-d.y,p.z-d.z)<55){ty+=(d.y<WW/2?60:-60);tz+=(d.z<WH/2?40:-40);}
        });
        steerTo(d,L_RING.x,clamp(ty,DR,WW-DR),clamp(tz,DR,WH-DR),difficulty!=='easy',n);
      } else if (d.role==='libero') {
        if(aiStriker){const s=d._s||(d._s=d.y<WW/2?-1:1);steerTo(d,aiStriker.x-55,clamp(aiStriker.y+s*70,DR,WW-DR),aiStriker.z,false,n*0.6);}
      } else if (d.role==='guider') {
        if(aiStriker)steerTo(d,(aiStriker.x+L_RING.x)/2,aiStriker.y,aiStriker.z,false,n*0.5);
      } else if (d.role==='sweeper') {
        if(playerDrone)steerTo(d,(playerDrone.x+WL*0.7)/1.7,playerDrone.y,playerDrone.z,false,n*0.4);
      } else if (d.role==='keeper') {
        const py=playerDrone?clamp(playerDrone.y+playerDrone.vy*14,DR,WW-DR):R_RING.cy;
        const pz=playerDrone?clamp(playerDrone.z+playerDrone.vz*14,DR,WH-DR):R_RING.cz;
        steerTo(d,R_RING.x-28,py,pz,false,n*0.3);
      }
    } else { // player's AI allies
      if (d.role==='keeper') {
        const ay=aiStriker?clamp(aiStriker.y+aiStriker.vy*14,DR,WW-DR):L_RING.cy;
        const az=aiStriker?clamp(aiStriker.z+aiStriker.vz*14,DR,WH-DR):L_RING.cz;
        steerTo(d,L_RING.x+28,ay,az,false,0.08);
      } else if (d.role==='sweeper') {
        if(aiStriker)steerTo(d,(aiStriker.x+WL*0.3)/1.3,aiStriker.y,aiStriker.z,false,0.1);
      } else if (d.role==='libero') {
        if(playerDrone){const s=d._s||(d._s=d.y<WW/2?-1:1);steerTo(d,playerDrone.x+50,clamp(playerDrone.y+s*70,DR,WW-DR),playerDrone.z,false,0.1);}
      } else if (d.role==='guider') {
        if(playerDrone)steerTo(d,clamp(playerDrone.x+95,DR,WL-DR),playerDrone.y,playerDrone.z,false,0.1);
      }
    }
  });
}

// ── ENTITIES ──────────────────────────────────────────────────────────────────
let drones=[], playerDrone=null, aiStriker=null;

function resetPositions() {
  const CX=WL/2,CY=WW/2,CZ=WH/2;
  playerDrone  = mkDrone(CX-180,CY,   CZ,   'player','striker','YOU');
  const pLib   = mkDrone(CX-110,CY-90,CZ+40,'player','libero', 'LIB');
  const pGdr   = mkDrone(CX- 60,CY+90,CZ-40,'player','guider', 'GDR');
  const pSwp   = mkDrone(CX-240,CY-80,CZ,   'player','sweeper','SWP');
  const pGk    = mkDrone(42,    CY,   CZ,   'player','keeper', 'GK');
  aiStriker    = mkDrone(CX+180,CY,   CZ,   'ai','striker','STR');
  const aLib   = mkDrone(CX+110,CY-90,CZ+40,'ai','libero', 'LIB');
  const aGdr   = mkDrone(CX+ 60,CY+90,CZ-40,'ai','guider', 'GDR');
  const aSwp   = mkDrone(CX+240,CY+80,CZ,   'ai','sweeper','SWP');
  const aGk    = mkDrone(WL-42, CY,   CZ,   'ai','keeper', 'GK');
  drones=[playerDrone,pLib,pGdr,pSwp,pGk,aiStriker,aLib,aGdr,aSwp,aGk];
  countdown=3;
}

// ── GAME STATE ────────────────────────────────────────────────────────────────
let gState='menu', difficulty='medium';
let sets={player:0,ai:0}, setGoals={player:0,ai:0}, currentSet=1;
const SET_WIN=5, MATCH_WIN=2;
let matchTime=180, goalFlash=null, setFlash=null, countdown=0;
let menuBtns=[], hoverBtn=null, drillObj=null, drillIdx=0, lastTS=0;

function startGame() {
  gState='game'; sets={player:0,ai:0}; setGoals={player:0,ai:0};
  currentSet=1; matchTime=180; goalFlash=null; setFlash=null;
  resetPositions();
}

// ── BIRD'S-EYE DRAWING ───────────────────────────────────────────────────────
function drawArena() {
  ctx.fillStyle='#040608'; ctx.fillRect(0,0,CW,CH);
  // Grass
  ctx.fillStyle='#091709'; ctx.fillRect(FX,FY,FW,FH);
  for(let i=0;i<10;i++){if(i%2===0){ctx.fillStyle='#0b1d0b';ctx.fillRect(FX+i*FW/10,FY,FW/10,FH);}}
  // Grid
  ctx.strokeStyle='#0f2a0f'; ctx.lineWidth=1;
  for(let xi=0;xi<=WL;xi+=WL/9){const p=ws(xi,0);ctx.beginPath();ctx.moveTo(p.sx,FY);ctx.lineTo(p.sx,FY+FH);ctx.stroke();}
  for(let yi=0;yi<=WW;yi+=WW/5){const p=ws(0,yi);ctx.beginPath();ctx.moveTo(FX,p.sy);ctx.lineTo(FX+FW,p.sy);ctx.stroke();}
  // Center markings
  ctx.strokeStyle='#1a4a1a'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  const cm=ws(WL/2,0); ctx.beginPath();ctx.moveTo(cm.sx,FY);ctx.lineTo(cm.sx,FY+FH);ctx.stroke(); ctx.setLineDash([]);
  const cc=ws(WL/2,WW/2);
  ctx.beginPath();ctx.arc(cc.sx,cc.sy,(FW+FH)/2*0.1,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#1a4a1a';ctx.beginPath();ctx.arc(cc.sx,cc.sy,4,0,Math.PI*2);ctx.fill();
  // Penalty boxes
  const pb=ws(WL*0.12,WW/2-WW*0.25); const pb2=ws(WL*0.88,WW/2-WW*0.25);
  ctx.strokeRect(FX,pb.sy,(pb2.sx-FX)*0.13,FH*0.5);
  ctx.strokeRect(FX+FW-(pb2.sx-FX)*0.13,pb.sy,(pb2.sx-FX)*0.13,FH*0.5);
  // Field border
  ctx.strokeStyle='#1a5a1a';ctx.lineWidth=3;ctx.strokeRect(FX,FY,FW,FH);
}

function drawRingTopDown(ring, isPlayerGoal) {
  const col  = isPlayerGoal ? '#2255ff' : '#00dd66';
  const cen  = ws(ring.x, ring.cy);
  const top  = ws(ring.x, ring.cy - ring.r);
  const bot  = ws(ring.x, ring.cy + ring.r);
  const ry   = bot.sy - cen.sy;   // vertical radius on screen
  const rx   = Math.max(10, ry * 0.18); // narrow horizontal — shows it's a hoop edge-on
  const pulse= 0.6 + 0.4*Math.sin(Date.now()/300);

  // Glow zone behind ring
  ctx.fillStyle = col + '18';
  ctx.beginPath(); ctx.ellipse(cen.sx, cen.sy, rx*3, ry, 0, 0, Math.PI*2); ctx.fill();

  // Outer hoop
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 18*pulse;
  ctx.strokeStyle = col; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(cen.sx, cen.sy, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
  // Inner hoop rim
  ctx.lineWidth = 2; ctx.strokeStyle = col + '66';
  ctx.beginPath(); ctx.ellipse(cen.sx, cen.sy, rx*0.5, ry*0.92, 0, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0; ctx.restore();

  // Endpoint caps
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cen.sx, top.sy, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cen.sx, bot.sy, 5, 0, Math.PI*2); ctx.fill();

  // Direction arrow showing which way to fly through
  const arrowX = isPlayerGoal ? cen.sx + rx + 18 : cen.sx - rx - 18;
  const dir    = isPlayerGoal ? -1 : 1;  // attack direction on screen
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(arrowX, cen.sy); ctx.lineTo(arrowX + dir*14, cen.sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(arrowX + dir*14, cen.sy - 6); ctx.lineTo(arrowX + dir*14 + dir*6, cen.sy); ctx.lineTo(arrowX + dir*14, cen.sy + 6); ctx.stroke();

  // Labels
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = isPlayerGoal ? 'right' : 'left';
  ctx.fillStyle = col;
  const lx = isPlayerGoal ? cen.sx - rx - 8 : cen.sx + rx + 8;
  ctx.fillText(isPlayerGoal ? 'DEFEND' : 'ATTACK', lx, cen.sy - ry - 8);
  ctx.font = '9px Courier New'; ctx.fillStyle = col + 'aa';
  ctx.fillText(isPlayerGoal ? 'YOUR GOAL' : "AI'S GOAL", lx, cen.sy - ry + 4);
}

function drawDroneTopDown(d) {
  const p=ws(d.x,d.y);
  const isStr=d.role==='striker';
  const col=d.team==='player'?(isStr?'#22aaff':'#1166bb'):(isStr?'#ff4422':'#bb2200');
  const dark=d.team==='player'?'#001844':'#440800';
  const r=isStr?13:9;
  // Altitude shadow offset (higher = more offset)
  const off=(d.z/WH)*7;
  ctx.fillStyle='#00000044';
  ctx.beginPath();ctx.ellipse(p.sx+off,p.sy+off,r*0.9,r*0.65,0,0,Math.PI*2);ctx.fill();
  // Protection cage
  if(isStr){ctx.strokeStyle=col+'44';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.sx,p.sy,r+5,0,Math.PI*2);ctx.stroke();}
  // Body (hexagon)
  if(d.boosting){ctx.shadowColor=col;ctx.shadowBlur=14;}
  ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6; i===0?ctx.moveTo(p.sx+Math.cos(a)*r,p.sy+Math.sin(a)*r):ctx.lineTo(p.sx+Math.cos(a)*r,p.sy+Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.strokeStyle=dark;ctx.lineWidth=1.5;ctx.stroke();
  ctx.shadowBlur=0;
  // Spinning props (seen from above as X marks)
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([ax,ay])=>{
    const pr=r*0.85, px2=p.sx+ax*pr, py2=p.sy+ay*pr;
    ctx.strokeStyle=dark;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.sx,p.sy);ctx.lineTo(px2,py2);ctx.stroke();
    const propR=r*0.38;
    ctx.strokeStyle=col+'99';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px2+Math.cos(d.spin)*propR,py2+Math.sin(d.spin)*propR);ctx.lineTo(px2-Math.cos(d.spin)*propR,py2-Math.sin(d.spin)*propR);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px2+Math.cos(d.spin+Math.PI/2)*propR,py2+Math.sin(d.spin+Math.PI/2)*propR);ctx.lineTo(px2-Math.cos(d.spin+Math.PI/2)*propR,py2-Math.sin(d.spin+Math.PI/2)*propR);ctx.stroke();
  });
  // Label
  ctx.font=`bold ${isStr?10:8}px Courier New`;ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(d.label,p.sx,p.sy-r-5);
  // Altitude bar (tiny vertical pill to right of drone)
  const bx=p.sx+r+4, by=p.sy-8, bh=16, bw=4;
  ctx.fillStyle='#111';ctx.fillRect(bx,by,bw,bh);
  const fill=bh*(d.z/WH);
  ctx.fillStyle=d.z>WH*0.65?'#ffdd00':col;ctx.fillRect(bx,by+bh-fill,bw,fill);
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=0.5;ctx.strokeRect(bx,by,bw,bh);
  // Boost bar (player striker only)
  if(d===playerDrone){
    const bw2=r*2.8,bh2=3;
    ctx.fillStyle='#111';ctx.fillRect(p.sx-bw2/2,p.sy+r+6,bw2,bh2);
    ctx.fillStyle=d.boost>60?'#ffdd00':d.boost>25?'#ff8800':'#ff2200';
    ctx.fillRect(p.sx-bw2/2,p.sy+r+6,bw2*(d.boost/BCAP),bh2);
  }
}

function drawAltStrip() {
  // Background
  ctx.fillStyle='#060a06';ctx.fillRect(APX,FY,APW,FH);
  ctx.strokeStyle='#1a3a1a';ctx.lineWidth=1;ctx.strokeRect(APX,FY,APW,FH);
  // Scoring altitude zone (where ring accepts)
  const zTop=altY(R_RING.cz+R_RING.r), zBot=altY(R_RING.cz-R_RING.r);
  ctx.fillStyle='#00dd6622';ctx.fillRect(APX,zTop,APW,zBot-zTop);
  ctx.strokeStyle='#00dd6688';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(APX,zTop);ctx.lineTo(APX+APW,zTop);ctx.stroke();
  ctx.beginPath();ctx.moveTo(APX,zBot);ctx.lineTo(APX+APW,zBot);ctx.stroke();
  // Player's goal zone (same z range, blue)
  ctx.fillStyle='#2255ff18';ctx.fillRect(APX,zTop,APW,zBot-zTop);
  // Player drone marker with glow
  if(playerDrone){
    const py2=altY(playerDrone.z);
    ctx.shadowColor='#22aaff';ctx.shadowBlur=8;
    ctx.fillStyle='#22aaff';ctx.beginPath();ctx.arc(APX+APW/2,py2,5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#ffffff44';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(APX,py2);ctx.lineTo(APX+APW,py2);ctx.stroke();
  }
  // Other drones
  drones.filter(d=>d!==playerDrone).forEach(d=>{
    const py2=altY(d.z);
    const col=d.team==='player'?'#1166bb':'#bb2200';
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(APX+APW/2,py2,3,0,Math.PI*2);ctx.fill();
  });
  ctx.font='7px Courier New';ctx.textAlign='center';ctx.fillStyle='#2a4a2a';
  ctx.fillText('ALT',APX+APW/2,FY-5);
  ctx.fillStyle='#1a3a2a';ctx.fillText('ZONE',APX+APW/2,FY+FH+9);
  ctx.fillStyle='#444';ctx.fillText('LC=UP',APX+APW/2,FY+FH+18);
  ctx.fillText('RC=DN',APX+APW/2,FY+FH+26);
}

function drawScene() {
  drawArena();
  drawRingTopDown(L_RING,true); drawRingTopDown(R_RING,false);
  // Draw player team under AI team, player striker on top
  const order=['ai','player'].flatMap(t=>drones.filter(d=>d.team===t&&d!==playerDrone));
  [...order,playerDrone].filter(Boolean).forEach(d=>drawDroneTopDown(d));
  drawAltStrip();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
const HUD_H=70;
function drawHUD() {
  ctx.fillStyle='#09090f';ctx.fillRect(0,0,CW,HUD_H);
  ctx.fillStyle='#1a1a28';ctx.fillRect(0,HUD_H-2,CW,2);
  ctx.font='bold 12px Courier New';ctx.textAlign='center';
  ctx.fillStyle='#00ff88';ctx.fillText('DRONE SOCCER  ·  5v5  ·  3D',CW/2,14);
  ctx.font='bold 32px Courier New';
  ctx.fillStyle='#ff4422';ctx.textAlign='right';ctx.fillText(setGoals.ai,CW/2-18,52);
  ctx.fillStyle='#333';ctx.textAlign='center';ctx.fillText('–',CW/2,52);
  ctx.fillStyle='#22aaff';ctx.textAlign='left';ctx.fillText(setGoals.player,CW/2+18,52);
  const m=Math.floor(matchTime/60),s=Math.floor(matchTime%60);
  ctx.font='bold 15px Courier New';ctx.fillStyle=matchTime<30?'#ff4444':'#aaa';
  ctx.textAlign='center';ctx.fillText(`${m}:${s.toString().padStart(2,'0')}`,CW/2,56);
  // Goal pips

function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function mkBtn(x,y,w,h,label,action,col,sub){
  const hot=hoverBtn===menuBtns.length;
  roundRect(x,y,w,h,8);ctx.fillStyle=hot?'#1e1e32':'#111120';ctx.fill();
  ctx.strokeStyle=hot?col:col+'55';ctx.lineWidth=2;ctx.stroke();
  ctx.font='bold 20px Courier New';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText(label,x+w/2,y+(sub?26:h/2+7));
  if(sub){ctx.font='11px Courier New';ctx.fillStyle='#666';ctx.fillText(sub,x+w/2,y+46);}
  menuBtns.push({x,y,w,h,action});
}
function decoDrone(x,y,col,t){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t)*0.22);
  ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;i===0?ctx.moveTo(Math.cos(a)*15,Math.sin(a)*15):ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15);}
  ctx.closePath();ctx.fill();
  const ps=t*4;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([ax,ay])=>{
    ctx.strokeStyle=col+'88';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ax*21,ay*21);ctx.stroke();
    ctx.save();ctx.translate(ax*21,ay*21);ctx.rotate(ps);ctx.strokeStyle=col+'bb';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();ctx.restore();
  });
  ctx.restore();
}

// ── DRILL 1: Ring Run ─────────────────────────────────────────────────────────
class RingRunDrill {
  constructor(){
    this.score=0;this.timeLeft=90;this.cur=0;this.flashes=[];
    playerDrone=mkDrone(50,WW/2,WH/2,'player','striker','YOU');
    drones=[playerDrone];aiStriker=null;
    this.rings=[
      {x:WL*0.15,cy:WW*0.25,cz:WH*0.3, r:62,col:'#ff4444'},
      {x:WL*0.3, cy:WW*0.75,cz:WH*0.7, r:62,col:'#ff8800'},
      {x:WL*0.45,cy:WW*0.3, cz:WH*0.5, r:62,col:'#ffff00'},
      {x:WL*0.58,cy:WW*0.7, cz:WH*0.25,r:62,col:'#44ff44'},
      {x:WL*0.7, cy:WW*0.4, cz:WH*0.75,r:62,col:'#44aaff'},
      {x:WL*0.83,cy:WW*0.6, cz:WH*0.4, r:62,col:'#cc44ff'},
      {x:WL*0.94,cy:WW*0.5, cz:WH*0.6, r:62,col:'#ff44cc'},
    ];
  }
  update(dt){
    this.timeLeft-=dt;if(this.timeLeft<=0){gState='drill_over';return;}
    const{ix,iy,iz,boost}=getInput();applyThrust(playerDrone,ix,iy,iz,boost);
    const rg=this.rings[this.cur%this.rings.length];
    if(Math.hypot(playerDrone.y-rg.cy,playerDrone.z-rg.cz)<rg.r&&Math.abs(playerDrone.x-rg.x)<55){
      this.score+=10;this.flashes.push({x:rg.x,cy:rg.cy,cz:rg.cz,timer:40});this.cur++;
    }
    this.flashes=this.flashes.filter(f=>{f.timer--;return f.timer>0;});
  }
  draw(){
    drawArena();
    this.rings.forEach((rg,i)=>{
      const active=i===this.cur%this.rings.length,col=rg.col;
      const N=28,pts=[];
      for(let j=0;j<=N;j++){const a=(j/N)*Math.PI*2;pts.push(project(rg.x,rg.cy+Math.cos(a)*rg.r,rg.cz+Math.sin(a)*rg.r));}
      ctx.save();if(active){ctx.shadowColor=col;ctx.shadowBlur=18;}
      ctx.strokeStyle=active?col:col+'44';ctx.lineWidth=active?6:3;
      ctx.beginPath();pts.forEach((p,j)=>{if(!p)return;j===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy);});ctx.stroke();ctx.shadowBlur=0;ctx.restore();
      const pc=project(rg.x,rg.cy,rg.cz);if(pc){ctx.font=`bold ${active?16:11}px Courier New`;ctx.textAlign='center';ctx.fillStyle=active?col:col+'55';ctx.fillText(i+1,pc.sx,pc.sy+5);}
      if(active&&i+1<this.rings.length){const nx=this.rings[i+1];ctx.strokeStyle=col+'33';ctx.lineWidth=1;ctx.setLineDash([4,8]);line3D(rg.x,rg.cy,rg.cz,nx.x,nx.cy,nx.cz);ctx.setLineDash([]);}
    });
    this.flashes.forEach(f=>{const p=project(f.x,f.cy,f.cz);if(!p)return;ctx.font=`bold ${18+(40-f.timer)/3}px Courier New`;ctx.textAlign='center';ctx.fillStyle=`rgba(255,230,0,${f.timer/40})`;ctx.fillText('+10',p.sx,p.sy-(40-f.timer)*0.4);});
    drawDrone3D(playerDrone);    drillHUD('RING RUN 3D',this.score,this.timeLeft,'#ffdd00',`Ring ${(this.cur%this.rings.length)+1}/7  ·  Match position AND altitude, fly through`);
  }
}

// ── DRILL 2: Breach Defense ───────────────────────────────────────────────────
class BreachDrill {
  constructor(){
    this.score=0;this.timeLeft=60;this.flash=null;
    playerDrone=mkDrone(WL*0.22,WW/2,WH/2,'player','striker','YOU');
    const ab1=mkDrone(WL-42, WW/2,   WH/2,   'ai','keeper','GK');
    const ab2=mkDrone(WL-110,WW/2-75,WH/2+55,'ai','sweeper','SWP');
    const ab3=mkDrone(WL-110,WW/2+75,WH/2-55,'ai','guider','GDR');
    const ab4=mkDrone(WL-175,WW/2,   WH/2,   'ai','libero','LIB');
    aiStriker=null;drones=[playerDrone,ab1,ab2,ab3,ab4];this.blockers=[ab1,ab2,ab3,ab4];
  }
  update(dt){
    this.timeLeft-=dt;if(this.timeLeft<=0){gState='drill_over';return;}
    const{ix,iy,iz,boost}=getInput();applyThrust(playerDrone,ix,iy,iz,boost);
    this.blockers.forEach((b,i)=>{
      let tx,ty,tz;
      if(i===0){tx=R_RING.x-28;ty=clamp(playerDrone.y+playerDrone.vy*12,DR,WW-DR);tz=clamp(playerDrone.z+playerDrone.vz*12,DR,WH-DR);}
      else{tx=(playerDrone.x+R_RING.x)/2;ty=clamp(playerDrone.y+(i===1?-72:72),DR,WW-DR);tz=clamp(playerDrone.z+(i===2?-55:55),DR,WH-DR);}
      steerTo(b,tx,ty,tz,false,0.18);collideDrones(playerDrone,b);
    });
    for(let i=0;i<this.blockers.length;i++)for(let j=i+1;j<this.blockers.length;j++)collideDrones(this.blockers[i],this.blockers[j]);
    if(ringCrossed(playerDrone,R_RING,1)){this.score+=10;this.flash={timer:40};playerDrone.x=WL*0.22;playerDrone.y=WW/2;playerDrone.z=WH/2;playerDrone.vx=0;playerDrone.vy=0;playerDrone.vz=0;playerDrone.prevX=playerDrone.x;}
    if(this.flash){this.flash.timer--;if(this.flash.timer<=0)this.flash=null;}
  }
  draw(){
    drawArena();drawRingTopDown(R_RING,false);
    if(this.flash){ctx.font='bold 36px Courier New';ctx.textAlign='center';ctx.fillStyle=`rgba(34,170,255,${this.flash.timer/40})`;ctx.shadowColor='#22aaff';ctx.shadowBlur=20;ctx.fillText('SCORE! +10',CW/2,CH/2-60);ctx.shadowBlur=0;}
    drones.forEach(d=>drawDroneTopDown(d));
    drawAltStrip();drillHUD('BREACH DEFENSE',this.score,this.timeLeft,'#ff44ff','Fly through the RIGHT ring · Change altitude to beat defenders · Resets after each score');
  }
}

// ── DRILL 3: Keeper Drill ─────────────────────────────────────────────────────
class KeeperDrill {
  constructor(){
    this.survived=0;this.aiGoals=0;this.maxGoals=5;this.flash=null;this.done=false;this.t=0;
    playerDrone=mkDrone(52,WW/2,WH/2,'player','keeper','GK');
    aiStriker=mkDrone(WL*0.58,WW/2,WH/2,'ai','striker','STR');
    drones=[playerDrone,aiStriker];
  }
  update(dt){
    if(this.done){if(keys['Space']||keys['Enter'])gState='drill_over';return;}
    this.survived+=dt;this.t+=dt;
    const{ix,iy,iz,boost}=getInput();applyThrust(playerDrone,ix,iy,iz,boost);
    steerTo(aiStriker,L_RING.x,clamp(L_RING.cy+Math.sin(this.t*0.7)*65,DR,WW-DR),clamp(L_RING.cz+Math.cos(this.t*0.5)*45,DR,WH-DR),true,0.07*Math.max(0,1-this.survived/30));
    collideDrones(playerDrone,aiStriker);
    if(ringCrossed(aiStriker,L_RING,-1)){
      this.aiGoals++;this.flash={timer:50};
      aiStriker.x=WL*0.58;aiStriker.y=WW/2;aiStriker.z=WH/2;aiStriker.vx=0;aiStriker.vy=0;aiStriker.vz=0;aiStriker.prevX=aiStriker.x;
      playerDrone.x=52;playerDrone.y=WW/2;playerDrone.z=WH/2;playerDrone.vx=0;playerDrone.vy=0;playerDrone.vz=0;
      if(this.aiGoals>=this.maxGoals)this.done=true;
    }
    if(this.flash){this.flash.timer--;if(this.flash.timer<=0)this.flash=null;}
  }
  draw(){
    drawArena();drawRingTopDown(L_RING,true);
    if(this.flash){ctx.font='bold 36px Courier New';ctx.textAlign='center';ctx.fillStyle=`rgba(255,68,34,${this.flash.timer/50})`;ctx.shadowColor='#ff4422';ctx.shadowBlur=20;ctx.fillText('AI SCORED!',CW/2,CH/2-60);ctx.shadowBlur=0;}
    [playerDrone,aiStriker].filter(Boolean).forEach(d=>drawDroneTopDown(d));
    for(let i=0;i<this.maxGoals;i++){ctx.beginPath();ctx.arc(CW/2-this.maxGoals*12+i*24,CH-20,7,0,Math.PI*2);ctx.fillStyle=i<this.aiGoals?'#ff4422':'#1a1a1a';ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();}
    if(this.done){
      ctx.fillStyle='#000000cc';ctx.fillRect(0,0,CW,CH);
      ctx.font='bold 42px Courier New';ctx.textAlign='center';ctx.fillStyle='#00ff88';ctx.fillText('DRILL COMPLETE',CW/2,CH/2-64);
      ctx.font='26px Courier New';ctx.fillStyle='#fff';ctx.fillText(`Survived: ${Math.floor(this.survived)}s`,CW/2,CH/2-10);
      let g='Keep Practicing';
      if(this.survived>=45)g='Elite Keeper';else if(this.survived>=30)g='Great Defense';else if(this.survived>=20)g='Good Block';else if(this.survived>=10)g='Getting There';
      ctx.font='20px Courier New';ctx.fillStyle='#ffdd00';ctx.fillText(g,CW/2,CH/2+30);
      ctx.font='13px Courier New';ctx.fillStyle='#444';ctx.fillText('SPACE or ENTER to continue',CW/2,CH/2+72);
    }
    this.score=Math.floor(this.survived);
    drawAltStrip();drillHUD('KEEPER DRILL',Math.floor(this.survived),null,'#00ff88',`YOU are GK · Block AI striker · Match its ALTITUDE · AI goals: ${this.aiGoals}/${this.maxGoals}`);
  }
}

function drawDrillOver(){
  if(drillObj)drillObj.draw();
  ctx.fillStyle='#000000bb';ctx.fillRect(0,0,CW,CH);
  const d=DRILLS[drillIdx];
  ctx.font='bold 38px Courier New';ctx.textAlign='center';ctx.fillStyle=d.col;ctx.shadowColor=d.col;ctx.shadowBlur=14;ctx.fillText(d.name+' DONE',CW/2,CH/2-66);ctx.shadowBlur=0;
  ctx.font='24px Courier New';ctx.fillStyle='#fff';ctx.fillText(`Score: ${drillObj?drillObj.score:0}`,CW/2,CH/2-12);
  menuBtns=[];
  [['TRY AGAIN',()=>startDrill(drillIdx)],['MORE DRILLS',()=>{gState='drill_select';}],['MAIN MENU',()=>{gState='menu';}]]
    .forEach(([l,f],i)=>mkBtn(CW/2-270+i*185,CH/2+40,170,40,l,f,'#5566cc'));
}

function startDrill(i){drillIdx=i;gState='drill';if(i===0)drillObj=new RingRunDrill();else if(i===1)drillObj=new BreachDrill();else drillObj=new KeeperDrill();}

// ── MOUSE ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  hoverBtn=null;menuBtns.forEach((b,i)=>{if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h)hoverBtn=i;});
  canvas.style.cursor=hoverBtn!==null?'pointer':'default';
});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  menuBtns.forEach(b=>{if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h)b.action();});
});

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function loop(ts){
  const dt=Math.min((ts-lastTS)/1000,0.05);lastTS=ts;
  if(keys['Escape']){keys['Escape']=false;
    if(gState==='game'||gState==='game_over')gState='menu';
    else if(gState==='drill'||gState==='drill_over')gState='drill_select';
    else if(gState==='drill_select')gState='menu';}

  switch(gState){
    case 'menu': menuBtns=[];drawMenu();break;
    case 'game':
      if(goalFlash){
        goalFlash.timer--;
        if(goalFlash.timer<=0){
          goalFlash=null;
          if(setGoals.player>=SET_WIN||setGoals.ai>=SET_WIN){
            const w=setGoals.player>=SET_WIN?'player':'ai';
            sets[w]++;setFlash={team:w,timer:180};setGoals={player:0,ai:0};currentSet++;matchTime=180;
            if(sets[w]>=MATCH_WIN)gState='game_over';else resetPositions();
          } else resetPositions();
        }
        drawScene();drawHUD();drawGoalFlash();
      } else if(setFlash){
        setFlash.timer--;if(setFlash.timer<=0)setFlash=null;
        drawScene();drawHUD();drawSetFlash();
      } else if(countdown>0){
        countdown-=dt;drawScene();drawHUD();drawCountdown();
      } else {
        const{ix,iy,iz,boost}=getInput();
        applyThrust(playerDrone,ix,iy,iz,boost);
        tickAI();
        for(let i=0;i<drones.length;i++)for(let j=i+1;j<drones.length;j++)collideDrones(drones[i],drones[j]);
        matchTime-=dt;if(matchTime<0){matchTime=0;gState='game_over';}
        if(ringCrossed(playerDrone,R_RING,1)){setGoals.player++;goalFlash={team:'player',timer:80};}
        if(aiStriker&&ringCrossed(aiStriker,L_RING,-1)){setGoals.ai++;goalFlash={team:'ai',timer:80};}
        drawScene();drawHUD();
      }
      break;
    case 'game_over': drawScene();drawHUD();menuBtns=[];drawMatchOver();break;
    case 'drill_select': menuBtns=[];drawDrillSelect();break;
    case 'drill': if(drillObj){drillObj.update(dt);drillObj.draw();}break;
    case 'drill_over': menuBtns=[];drawDrillOver();break;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{lastTS=ts;requestAnimationFrame(loop);});
</script>
