<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 1px solid #2a2a2a;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #fff;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #888;
      font-style: italic;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.6rem 1.4rem;
      border: 1px solid #555;
      background: transparent;
      color: #e8e8e8;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      font-family: inherit;
    }

    .btn:hover {
      background: #e8e8e8;
      color: #0f0f0f;
      border-color: #e8e8e8;
    }

    .btn-primary {
      border-color: #c8a96e;
      color: #c8a96e;
    }

    .btn-primary:hover {
      background: #c8a96e;
      color: #0f0f0f;
    }

    #file-input { display: none; }

    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: #444;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      stroke: #333;
      margin-bottom: 1rem;
    }

    .empty-state p {
      font-size: 1.1rem;
    }

    /* Masonry grid */
    .gallery {
      columns: 3 280px;
      column-gap: 12px;
      padding: 1rem 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #1a1a1a;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      opacity: 0.75;
    }

    .gallery-item .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
      background: linear-gradient(transparent 50%, rgba(0,0,0,0.7));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .gallery-item:hover .overlay {
      opacity: 1;
    }

    .gallery-item .overlay span {
      font-size: 0.8rem;
      color: #ddd;
      letter-spacing: 0.05em;
    }

    .gallery-item .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .gallery-item:hover .remove-btn {
      display: flex;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: #aaa;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    .lightbox-close:hover { color: #fff; }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      font-size: 2rem;
      padding: 1rem 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lightbox-nav:hover { background: rgba(255,255,255,0.18); }
    .lightbox-nav.prev { left: 0.5rem; }
    .lightbox-nav.next { right: 0.5rem; }

    footer {
      text-align: center;
      padding: 2rem;
      color: #333;
      font-size: 0.8rem;
      border-top: 1px solid #1e1e1e;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Gallery</h1>
    <p>A collection of my work</p>
  </header>

  <div class="controls">
    <label for="file-input" class="btn btn-primary">+ Add Images</label>
    <input type="file" id="file-input" accept="image/*" multiple />
    <button class="btn" id="clear-btn" onclick="clearAll()" style="display:none">Clear All</button>
  </div>

  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <p>Click "Add Images" to start your gallery</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
    <button class="lightbox-nav prev" onclick="lightboxNav(-1)">&#8249;</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox-nav next" onclick="lightboxNav(1)">&#8250;</button>
  </div>

  <footer>
    <p>Open this file in any browser &mdash; your images stay private on your device</p>
  </footer>

  <script>
    let images = []; // { src, name }
    let lightboxIndex = 0;

    document.getElementById('file-input').addEventListener('change', function () {
      const files = Array.from(this.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => addImage(e.target.result, file.name);
        reader.readAsDataURL(file);
      });
      this.value = '';
    });

    function addImage(src, name) {
      images.push({ src, name });
      render();
    }

    function removeImage(index, e) {
      e.stopPropagation();
      images.splice(index, 1);
      render();
    }

    function render() {
      const gallery = document.getElementById('gallery');
      const empty = document.getElementById('empty-state');
      const clearBtn = document.getElementById('clear-btn');

      if (images.length === 0) {
        gallery.innerHTML = '';
        empty.style.display = 'block';
        clearBtn.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      clearBtn.style.display = 'inline-block';

      gallery.innerHTML = images.map((img, i) => `
        <div class="gallery-item" onclick="openLightbox(${i})">
          <img src="${img.src}" alt="${img.name}" loading="lazy" />
          <div class="overlay"><span>${img.name}</span></div>
          <button class="remove-btn" onclick="removeImage(${i}, event)" title="Remove">&#x2715;</button>
        </div>
      `).join('');
    }

    function clearAll() {
      if (confirm('Remove all images from the gallery?')) {
        images = [];
        render();
      }
    }

    function openLightbox(index) {
      lightboxIndex = index;
      document.getElementById('lightbox-img').src = images[index].src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function lightboxNav(dir) {
      lightboxIndex = (lightboxIndex + dir + images.length) % images.length;
      document.getElementById('lightbox-img').src = images[lightboxIndex].src;
    }

    document.getElementById('lightbox').addEventListener('click', function (e) {
      if (e.target === this) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') lightboxNav(1);
      if (e.key === 'ArrowLeft') lightboxNav(-1);
    });
  </script>
</body>
</html>
